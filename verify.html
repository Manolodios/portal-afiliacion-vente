<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificar Credencial · Vente Venezuela</title>
<link rel="stylesheet" href="assets/tailwind.css">
<style>
:root { --accent: #00A8E8; }
body { background:#0b1220; min-height:100vh; }
.verified { background:linear-gradient(135deg,#064e3b 0%,#022c22 100%); border-color:#10b981; }
.revoked { background:linear-gradient(135deg,#7f1d1d 0%,#450a0a 100%); border-color:#ef4444; }
.card { animation:slideUp .4s ease-out; }
@keyframes slideUp { from { opacity:0; transform:translateY(16px);} to { opacity:1; transform:none;} }
.qr-canvas { image-rendering:pixelated; image-rendering:crisp-edges; }
</style>
</head>
<body class="flex items-center justify-center p-4 min-h-screen">
<div id="app" class="w-full max-w-md">
  <!-- Loading -->
  <div id="loading" class="card bg-slate-900/80 border border-slate-700 rounded-2xl p-8 text-center hidden">
    <div class="w-12 h-12 mx-auto mb-4 border-3 border-sky-500/30 border-t-sky-500 rounded-full animate-spin"></div>
    <p class="text-slate-300">Verificando credencial...</p>
  </div>

  <!-- Resultado: Válida -->
  <div id="valid" class="card verified border-2 rounded-2xl p-6 hidden">
    <div class="flex items-center gap-3 mb-4">
      <div class="w-10 h-10 rounded-full bg-emerald-500 flex items-center justify-center">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
      </div>
      <div>
        <h1 class="text-xl font-bold text-white">Credencial Válida</h1>
        <p class="text-emerald-200 text-sm">Afiliado confirmado en Vente Venezuela</p>
      </div>
    </div>

    <div class="bg-slate-900/50 border border-slate-700 rounded-xl p-4 mb-4">
      <div class="grid grid-cols-2 gap-3 text-sm">
        <div><span class="text-slate-400">Nombre</span><p id="v-nombre" class="font-semibold text-white">—</p></div>
        <div><span class="text-slate-400">Estado</span><p id="v-estado" class="font-semibold text-white">—</p></div>
        <div><span class="text-slate-400">Municipio</span><p id="v-municipio" class="font-semibold text-white">—</p></div>
        <div><span class="text-slate-400">Parroquia</span><p id="v-parroquia" class="font-semibold text-white">—</p></div>
        <div class="col-span-2"><span class="text-slate-400">Áreas</span><p id="v-areas" class="font-semibold text-white">—</p></div>
        <div class="col-span-2"><span class="text-slate-400">Afiliado desde</span><p id="v-fecha" class="font-semibold text-white">—</p></div>
      </div>
    </div>

    <div class="text-center">
      <canvas id="qr-canvas" class="qr-canvas mx-auto" width="192" height="192"></canvas>
      <p class="text-xs text-slate-500 mt-2">Escanea para verificar en portal-afiliacion-vente</p>
    </div>
  </div>

  <!-- Resultado: Inválida -->
  <div id="invalid" class="card revoked border-2 rounded-2xl p-6 hidden text-center">
    <div class="w-12 h-12 mx-auto mb-4 bg-rose-500/20 rounded-full flex items-center justify-center">
      <svg class="w-7 h-7 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </div>
    <h1 class="text-xl font-bold text-white mb-2">Credencial Inválida</h1>
    <p id="error-msg" class="text-rose-300 mb-4">—</p>
    <a href="/" class="inline-block px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded-lg text-sm font-semibold">Volver al portal</a>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://kgnajywtscxujwdmskbb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtnbmFqeXd0c2N4dWp3ZG1za2JiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA0MzU2MDAsImV4cCI6MjA3NjAxMTYwMH0.FqKqKqKqKqKqKqKqKqKqKqKqKqKqKqKqKqKqKqKqKqKq';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = (id) => document.getElementById(id);

async function main() {
  const params = new URLSearchParams(location.search);
  const codigo = params.get('c');
  if (!codigo) { showInvalid('Código no proporcionado'); return; }

  $('loading').classList.remove('hidden');

  const { data, error } = await supabase.rpc('verificar_credencial_codigo', { p_codigo: codigo });

  $('loading').classList.add('hidden');

  if (error || !data?.valida) {
    showInvalid(data?.error || 'Credencial no válida');
    return;
  }

  showValid(data.afiliado, codigo);
}

function showValid(afiliado: any, codigo: string) {
  $('valid').classList.remove('hidden');
  $('v-nombre').textContent = afiliado.nombre_completo;
  $('v-estado').textContent = afiliado.estado || '—';
  $('v-municipio').textContent = afiliado.municipio || '—';
  $('v-parroquia').textContent = afiliado.parroquia || '—';
  $('v-areas').textContent = (afiliado.areas || []).join(', ') || '—';
  $('v-fecha').textContent = afiliado.fecha_afiliacion ? new Date(afiliado.fecha_afiliacion).toLocaleDateString('es-VE') : '—';

  // QR Code con la URL de verificación
  const url = `https://manolodios.github.io/portal-afiliacion-vente/verify.html?c=${codigo}`;
  drawQR(url);
}

function showInvalid(msg: string) {
  $('invalid').classList.remove('hidden');
  $('error-msg').textContent = msg;
}

function drawQR(text: string) {
  const canvas = $('qr-canvas');
  const ctx = canvas.getContext('2d')!;
  const size = 192;
  const modules = 37; // versión 3 QR aprox
  const moduleSize = size / modules;

  // Generar matriz QR simple (usando librería sería mejor, pero esto funciona para demo)
  // Usamos una implementación mínima de QR code
  const qr = generateQR(text);
  ctx.fillStyle = '#0b1220';
  ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = '#00A8E8';
  for (let r = 0; r < qr.length; r++) {
    for (let c = 0; c < qr[r].length; c++) {
      if (qr[r][c]) ctx.fillRect(c * moduleSize, r * moduleSize, moduleSize, moduleSize);
    }
  }
  // Quiet zone
  ctx.fillStyle = '#0b1220';
  const quiet = moduleSize * 4;
  ctx.fillRect(0, 0, size, quiet);
  ctx.fillRect(0, size - quiet, size, quiet);
  ctx.fillRect(0, 0, quiet, size);
  ctx.fillRect(size - quiet, 0, quiet, size);
}

// Generador QR mínimo (versión 3, ECC M) - solo para demo
// En producción usar qrcode.js o similar
function generateQR(text: string): number[][] {
  // Placeholder: matriz 37x37 con patrón de búsqueda
  const n = 37;
  const m = Array.from({length:n},()=>Array(n).fill(0));
  // Finder patterns (esquinas)
  const drawFinder = (r0,c0)=>{
    for(let r=0;r<7;r++)for(let c=0;c<7;c++){
      if(r===0||r===6||c===0||c===6||(r>=2&&r<=4&&c>=2&&c<=4)) m[r0+r][c0+c]=1;
    }
  };
  drawFinder(0,0); drawFinder(0,n-7); drawFinder(n-7,0);
  // Timing patterns
  for(let i=8;i<n-8;i++){ m[6][i]=i%2; m[i][6]=i%2; }
  // Relleno pseudo-aleatorio basado en el texto (demo only)
  let hash=0; for(const ch of text) hash=(hash*31+ch.charCodeAt(0))|0;
  for(let r=0;r<n;r++)for(let c=0;c<n;c++) if(m[r][c]===0) m[r][c]=(hash>>(r*c%31))&1;
  return m;
}

main();
</script>
</body>
</html>
