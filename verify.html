<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Correo verificado - Vente Venezuela</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-950 text-white p-4">
<main class="bg-white text-slate-900 rounded-2xl shadow-2xl max-w-md w-full p-8 text-center space-y-4">
<img src="assets/202605201779298032-logo-vente-cabimas-actualizado-04-2026-at-3x.png" alt="Vente Cabimas" class="h-12 mx-auto">
<div id="icon" class="text-5xl">⏳</div>
<h1 id="title" class="text-2xl font-black">Verificando tu correo...</h1>
<p id="desc" class="text-sm text-slate-600">Un momento, estamos confirmando tu cuenta.</p>
<form id="newpass-form" class="hidden space-y-3 text-left">
  <div>
    <label class="block text-xs font-semibold text-slate-700 mb-1">Nueva contraseña</label>
    <div class="relative">
    <input type="password" id="newpass1" minlength="8" required placeholder="Mínimo 8 caracteres" class="w-full px-3 pr-10 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-cyan-500 focus:outline-none">
      <button type="button" onclick="togglePass('newpass1', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-lg leading-none" aria-label="Mostrar contraseña">👁️</button>
    </div>
  </div>
  <div>
    <label class="block text-xs font-semibold text-slate-700 mb-1">Confirmar contraseña</label>
    <div class="relative">
    <input type="password" id="newpass2" minlength="8" required placeholder="Repite tu contraseña" class="w-full px-3 pr-10 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-cyan-500 focus:outline-none">
      <button type="button" onclick="togglePass('newpass2', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-lg leading-none" aria-label="Mostrar contraseña">👁️</button>
    </div>
  </div>
  <button type="submit" id="newpass-btn" class="w-full py-2.5 bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold rounded-lg text-sm">Guardar nueva clave</button>
</form>
<a id="cta" href="index.html" class="hidden inline-block mt-2 px-5 py-2.5 bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold rounded-lg text-sm">Volver al portal e ingresar</a>
</main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase = createClient(
  "https://kgnajywtscxujwdmskbb.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtnbmFqeXd0c2N4dWp3ZG1za2JiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMjYzODgsImV4cCI6MjEwNTYwMjM4OH0.OMnquIl64Zvo1yhG2Qgy1CVH3U1BndgOW1_sk7EcHuU",
  { auth: { detectSessionInUrl: false } }
);
const title = document.getElementById("title");
const desc = document.getElementById("desc");
const icon = document.getElementById("icon");
const cta = document.getElementById("cta");
function ok(msgTitle, msgDesc) {
  icon.textContent = "\u2705";
  title.textContent = msgTitle;
  desc.textContent = msgDesc;
  cta.classList.remove("hidden");
}
function fail(msgTitle, msgDesc) {
  icon.textContent = "\u26a0\uFE0F";
  title.textContent = msgTitle;
  desc.textContent = msgDesc;
  cta.classList.remove("hidden");
}
function showRecoveryForm() {
  icon.textContent = "\u{1F511}";
  title.textContent = "Crea tu nueva clave";
  desc.textContent = "Tu correo fue verificado. Escribe tu nueva contraseña.";
  document.getElementById("newpass-form").classList.remove("hidden");
  cta.classList.add("hidden");
}
document.getElementById("newpass-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const p1 = document.getElementById("newpass1").value;
  const p2 = document.getElementById("newpass2").value;
  if (p1.length < 8) { desc.textContent = "La contraseña debe tener al menos 8 caracteres."; return; }
  if (p1 !== p2) { desc.textContent = "Las contraseñas no coinciden."; return; }
  const btn = document.getElementById("newpass-btn");
  btn.disabled = true; btn.textContent = "Guardando...";
  const { error } = await supabase.auth.updateUser({ password: p1 });
  btn.disabled = false; btn.textContent = "Guardar nueva clave";
  if (error) { desc.textContent = "No se pudo guardar: " + error.message; return; }
  document.getElementById("newpass-form").classList.add("hidden");
  ok("Clave actualizada", "Ya puedes cerrar esta página y entrar con tu nueva contraseña.");
});
function togglePass(id, btn) {
  const inp = document.getElementById(id);
  if (!inp) return;
  const show = inp.type === "password";
  inp.type = show ? "text" : "password";
  btn.textContent = show ? "\u{1F648}" : "\u{1F441}\uFE0F";
}
const url = new URL(window.location.href);
const hash = new URLSearchParams(window.location.hash.replace(/^#\/?/, ""));
const type = url.searchParams.get("type") || hash.get("type") || "";
const code = url.searchParams.get("code");
const token_hash = url.searchParams.get("token_hash");
let session = null;
const problems = [];
if (code) {
  try {
    const { data, error } = await supabase.auth.exchangeCodeForSession(window.location.href);
    if (error) throw error;
    session = data.session;
  } catch (e) { problems.push("codigo: " + e.message); }
}
if (!session && token_hash) {
  try {
    const { data, error } = await supabase.auth.verifyOtp({ token_hash, type: type || "signup" });
    if (error) throw error;
    session = data.session;
  } catch (e) { problems.push("token: " + e.message); }
}
if (!session && hash.get("access_token")) {
  try {
    const { data, error } = await supabase.auth.setSession({
      access_token: hash.get("access_token"),
      refresh_token: hash.get("refresh_token") || ""
    });
    if (error) throw error;
    session = data.session;
  } catch (e) { problems.push("sesion: " + e.message); }
}
if (!session) {
  try {
    const { data } = await supabase.auth.getSession();
    session = data.session;
  } catch (e) { problems.push("lectura: " + e.message); }
}
if (session) {
  if (type === "recovery") showRecoveryForm();
  else ok("Ya estás verificado", "Ya puedes cerrar esta página y entrar al portal.");
} else {
  fail("Enlace inválido o expirado", (problems.length ? "Motivo: " + problems.join(" | ") + ". " : "") + "Pide un nuevo correo de confirmación desde el portal.");
}
</script>
</body>
</html>
